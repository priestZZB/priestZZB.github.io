# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# 网站语言 › 可选：zh-CN（中文）/ en（英文），对应 _data/locales 下的语言文件
lang: zh-CN # 建议改为中文，如需英文保留 en 即可

# 时区 › 示例：Asia/Shanghai（中国时区），必填！
timezone: Asia/Shanghai

# jekyll-seo-tag 插件设置 › 影响 SEO 和站点元信息
# ↓ --------------------------

# 站点主标题
title: ZZB'BLOG # 例如：「XX的技术博客」
# 站点副标题（显示在标题下方）
tagline: share with you # 例如：「专注前端/后端/运维技术分享」
# 站点描述（用于 SEO 和 RSS 订阅）
description: >-
  分享编程学习、技术踩坑、工具使用的原创内容，专注于 Java/前端开发

# 你的站点完整地址（必填！）
# 示例：GitHub Pages 填 https://你的用户名.github.io，自建站点填 https://你的域名.com
# 注意：结尾不要加 /
url: "https://priestZZB.github.io"

# GitHub 账号信息
github:
  username: priestZZB # 例如：octocat

# Twitter 账号（不用可留空）
twitter:
  username:  # 例如：octocat

# 社交信息（核心，影响版权、作者信息）
social:
  # 你的全名（显示在页脚版权、文章默认作者处）
  name: Angeus # 例如：张三 / 小李的技术笔记
  # 你的邮箱（显示在页脚）
  email: zzb070104@163.com # 例如：zhangsan@example.com
  # 社交链接（第一个是版权处的链接，建议填 GitHub/个人主页）
  links:
     # 不用可删除
    - https://github.com/priestZZB # 核心链接，建议保留
    # 可选添加更多社交链接
    # - https://www.linkedin.com/in/你的领英用户名/
    # - https://zhuanlan.zhihu.com/你的知乎专栏

# 站点验证（用于搜索引擎收录验证，不用可留空）
webmaster_verifications:
  google: # Google 验证码
  bing: # Bing 验证码
  baidu: # 百度验证码（国内站点建议填）

# ↑ --------------------------
# jekyll-seo-tag 设置结束

# 网站分析工具（不用可留空）
analytics:
  google:
    id: # Google Analytics ID（例如：G-XXXXXXXXXX）
  goatcounter:
    id: # GoatCounter ID
  umami:
    id: # Umami ID
    domain: # Umami 域名
  matomo:
    id: # Matomo ID
    domain: # Matomo 域名
  cloudflare:
    id: # Cloudflare 分析 Token
  fathom:
    id: # Fathom 站点 ID

# 页面访问量统计（仅支持 goatcounter，不用留空）
pageviews:
  provider: goatcounter # 填 goatcounter 或留空

# 主题模式（留空则跟随系统，可选 light/ dark）
theme_mode: dark # [light | dark]

# 媒体资源 CDN（不用留空）
# 示例：https://cdn.example.com，所有 / 开头的媒体文件都会拼接该前缀
cdn:

# 侧边栏头像（支持本地路径或外网 URL）
# 本地路径示例：/assets/images/avatar.png（需把图片放在 assets/images 下）
# 外网 URL 示例：https://avatars.githubusercontent.com/u/12345678?v=4
avatar: /assets/img/avator.jpg # 替换为你的头像路径/URL

# 站点社交预览图（用于分享时的封面，不用留空）
social_preview_image:  # 替换为你的预览图路径/URL

# 是否全局显示文章目录（TOC）
toc: true

# 评论系统（全局开关，留空则关闭评论）
comments:
  provider: giscus # 推荐用 giscus（免费、基于 GitHub Discussions），可选 disqus/utterances/giscus
  # Disqus 配置（不用则留空）
  disqus:
    shortname: # 你的 Disqus 短名称
  # Utterances 配置（基于 GitHub Issues）
  utterances:
    repo: 你的GitHub用户名/你的仓库名 # 例如：octocat/hexo-blog
    issue_term: pathname
  # Giscus 配置（推荐，需先在 https://giscus.app/ 生成配置）
  giscus:
    repo: 你的GitHub用户名/你的仓库名 # 例如：octocat/hexo-blog
    repo_id: 你的仓库ID # Giscus 生成的 repo ID
    category: 讨论分类 # 例如：General
    category_id: 分类ID # Giscus 生成的 category ID
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: zh-CN # 评论区语言，中文填 zh-CN
    reactions_enabled: 1

# 静态资源自托管（不用则留空）
assets:
  self_host:
    enabled: false
    env: # [development | production]

# PWA 功能（建议开启）
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      # - "/example" # 不需要缓存的路径

# 每页文章数量
paginate: 10

# 站点基础路径（GitHub Pages 如非根域名需填，例如 /blog，根域名留空）
baseurl: ""

# ------------ 以下配置不建议修改 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/